name: Squadle
description: >-
  Squadle is a food safety and operational compliance platform for multi-unit
  restaurant and foodservice operations. It combines IoT remote temperature
  monitoring (its Remote Temperature System) with digital food-safety checklists,
  shift management, and patented ZeroTouch technology that automates temperature
  logging and triggers corrective actions. The platform reports 3.3B+ completed
  tasks and 100M+ temperatures measured. Squadle was acquired by Crunchtime and
  now operates as part of the Crunchtime Operations Execution platform; the
  squadle.com domain redirects to crunchtime.com/squadle. No public API or
  developer platform is currently published.
